[project]
name = "epl"
version = "0.1.0"
description = "EPL fantasy data pipeline, agent, and UI"
requires-python = ">=3.11"
dependencies = [
    # ingestion (component 1) -- unifies the ad hoc `pip install` list from
    # README's Setup section into one dependency source
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    # agent (component 2) -- see docs/agent_ui_architecture_plan.md
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "fastapi-users[sqlalchemy]>=13.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "anthropic>=0.34",
    "mcp>=2.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `agent` is the only thing meant to be imported as a package. `ingestion`
# stays unpackaged, run as plain scripts the way it already is (README's
# Setup section) -- not touched by this scaffolding.
packages = ["agent"]
